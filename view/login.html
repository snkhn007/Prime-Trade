<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1a1a1a;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #6b6b6b;
      margin-bottom: 32px;
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #444;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 13px;
      font-size: 0.9rem;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s;
      color: #1a1a1a;
    }

    input:focus { border-color: #1a1a1a; }
    input::placeholder { color: #b0b0b0; }

    button {
      width: 100%;
      padding: 11px;
      margin-top: 24px;
      background: #1a1a1a;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #333; }

    .footer {
      text-align: center;
      font-size: 0.82rem;
      color: #6b6b6b;
      margin-top: 20px;
    }

    .footer a {
      color: #1a1a1a;
      font-weight: 500;
      text-decoration: none;
    }

    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to your account</p>

    <form action="/login" method="POST">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="mail" placeholder="jane@example.com" autocomplete="email" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="ps" placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <button type="submit">Log in</button>
    </form>

    <p class="footer">No account? <a href="/signup">Create one</a></p>
  </div>
</body>
</html>
