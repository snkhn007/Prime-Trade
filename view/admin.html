<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body{
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      color: #1a1a1a;
      padding: 40px 20px;
    }
    .wrapper{
        width: 100%;
         max-width: 680px; 
         margin: 0;
    }
    header{
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }
    header h1{ 
        font-size: 1.4rem; 
        font-weight: 600; 
    }
    header a{
      font-size: 0.82rem;
      color: #6b6b6b;
      text-decoration: none;
    }
    .section-label{
      font-size: 0.8rem;
      font-weight: 500;
      color: #6b6b6b;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 10px;
    }
    .user-card{
      background: #fff;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 10px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #1a1a1a;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .user-info{ 
        flex: 1; 
    }
    .user-name{
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .user-email{ 
        font-size: 0.82rem; 
        color: #6b6b6b; 
    }
    .user-role{
      font-size: 0.75rem;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 20px;
      background: #f0f0f0;
      color: #444;
      flex-shrink: 0;
    }
    .user-role.admin {
      background: #1a1a1a;
      color: #fff;
    }
    .empty{
      text-align: center;
      font-size: 0.85rem;
      color: #aaa;
      padding: 32px 0;
    }
    .stats{
      background: #fff;
      border-radius: 12px;
      padding: 20px 24px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
      margin-bottom: 24px;
      display: flex;
      gap: 32px;
    }
    .stat-value{
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 0.78rem;
      color: #6b6b6b;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>Admin Panel</h1>
      <a href="/logout">Log out</a>
    </header>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-item">
        <div class="stat-value" id="total-users">—</div>
        <div class="stat-label">Total users</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="total-admins">—</div>
        <div class="stat-label">Admins</div>
      </div>
    </div>

    <p class="section-label">All Users</p>
    <div id="user-list"></div>
  </div>
    <script>
        async function loadUsers() {
            const res = await fetch('/admin/users');
            const users = await res.json();

            document.getElementById('total-users').textContent = users.length;
            document.getElementById('total-admins').textContent = users.filter(u => u.role === 'admin').length;

            const list = document.getElementById('user-list');

            if (!users.length) {
                list.innerHTML = '<p class="empty">No users found.</p>';
                return;
            }

            list.innerHTML = users.map(u => `
                <div class="user-card">
                    <div class="avatar">${u.name.charAt(0).toUpperCase()}</div>
                    <div class="user-info">
                        <div class="user-name">${u.name}</div>
                        <div class="user-email">${u.email}</div>
                    </div>
                    <span class="user-role ${u.role === 'admin' ? 'admin' : ''}">${u.role || 'user'}</span>
                </div>
            `).join('');
        } 

        loadUsers();
    </script>
</body>
</html>
